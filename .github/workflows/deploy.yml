# =============================================================================
# GitHub Actions CI/CD Pipeline для Robot Platform
# =============================================================================

name: Robot Platform CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # 1. Lint & Tests
  # =============================================================================
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-cov || true
      
      - name: Lint (flake8)
        run: |
          flake8 platform/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 platform/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics || true
      
      - name: Format check (black)
        run: |
          black --check platform/ || true
      
      - name: Run tests (pytest)
        run: |
          pytest --cov=platform --cov-report=xml || true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # =============================================================================
  # 2. Build Docker Image
  # =============================================================================
  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # 3. Deploy to Raspberry Pi
  # =============================================================================
  deploy-pi:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Raspberry Pi via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_PORT }}
          script_stop: true
          script: |
            echo "🛑 Stopping services..."
            sudo systemctl stop robot-navigation robot-web || true
            
            echo "🐳 Stopping Docker containers..."
            docker stop robot-platform || true
            docker rm robot-platform || true
            
            echo "📦 Pulling latest Docker image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true
            
            echo "🚀 Starting new container..."
            docker run -d \
              --name robot-platform \
              --restart unless-stopped \
              --network host \
              --privileged \
              --device /dev/ttyUSB0 \
              --device /dev/ttyS0 \
              -v /home/${{ secrets.PI_USER }}/robot_app/config.json:/home/robot/app/config.json:ro \
              -v /home/${{ secrets.PI_USER }}/robot_app/serviceAccountKey.json:/home/robot/app/serviceAccountKey.json:ro \
              -v robot-logs:/var/log/robot \
              -v robot-data:/home/robot/app/logs \
              -e TZ=Europe/Kiev \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true
            
            echo "✅ Starting services..."
            sudo systemctl daemon-reload
            sudo systemctl start robot-navigation robot-web || true
            
            echo "📊 Checking status..."
            sudo systemctl status robot-navigation --no-pager || true
            sudo systemctl status robot-web --no-pager || true
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f || true

  # =============================================================================
  # 4. Notification (Telegram)
  # =============================================================================
  notify-telegram:
    needs: deploy-pi
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🤖 Robot Platform Deployment
            
            Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ${{ job.status == 'success' && '✅ Deployment successful!' || '❌ Deployment failed!' }}
          format: markdown 
